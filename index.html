<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0E4A32"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><title>بطاقات التلاميذ — Cartes scolaires</title>
<style>
:root{--g:#0E4A32;--g2:#1F5C3A;--gold:#DEB028;--bg:#f3f6f3;--line:#d7e1d9;--ink:#17261d;--mut:#66756b;--no:#b3261e}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
header{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px #0003}
header h1{margin:0;font-size:18px}header .sub{font-size:12px;opacity:.85;margin-top:2px}
.hrow{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.flag{height:4px;background:linear-gradient(90deg,#14b53a 33%,#fcd116 33% 66%,#ce1126 66%)}
#sbar{display:flex;gap:6px;padding:8px 12px;background:#eaf1ec;border-bottom:1px solid var(--line);align-items:center}#sbar select{flex:1;font-weight:700}#sbar .btn{padding:8px 12px}
nav{display:flex;gap:6px;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:60px;z-index:4;overflow-x:auto}
nav button{flex:1;min-width:84px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 8px;font:inherit;font-weight:700;color:var(--mut);cursor:pointer}
nav button.on{background:var(--g);color:#fff;border-color:var(--g)}
main{max-width:980px;margin:0 auto;padding:14px 12px 80px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:16px;color:var(--g)}
label{display:block;font-weight:700;font-size:13px;margin:10px 0 4px;color:#33473a}
input[type=text],input[type=tel],input[type=number],input[type=date],select{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid #1f5c3a55;border-color:var(--g2)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:560px){.g2,.g3{grid-template-columns:1fr}}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer;color:var(--ink)}
.btn.p{background:var(--g);color:#fff;border-color:var(--g)}.btn.gold{background:var(--gold);color:#143d27;border-color:var(--gold)}.btn.r{color:var(--no);border-color:#e8b9b5}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sub{font-size:12px;color:var(--mut)}.note{background:#fff8e1;border:1px solid #f1dd9b;border-radius:10px;padding:8px 10px;font-size:13px;margin:8px 0}
.warn{background:#fdecea;border-color:#f3b8b3}
.imgbox{display:flex;align-items:center;gap:10px}.imgbox img{width:56px;height:56px;object-fit:contain;border:1px dashed var(--line);border-radius:8px;background:#fafafa}
table{width:100%;border-collapse:collapse}th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:start;font-size:14px}th{font-size:12px;color:var(--mut)}
.ph{width:40px;height:40px;border-radius:8px;object-fit:cover;background:#e8f1eb;display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:var(--g);cursor:pointer;border:1px solid var(--line)}
.stu{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.stu .grow{flex:1;min-width:0;cursor:pointer}.stu .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tpls{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scroll-snap-type:x proximity}.tp{flex:0 0 138px;scroll-snap-align:start;border:2px solid var(--line);border-radius:12px;padding:6px;cursor:pointer;text-align:center;background:#fff}.tp.on{border-color:var(--g);background:#eaf4ee;box-shadow:0 0 0 2px #0e4a3233}.tpc{height:116px;display:flex;align-items:center;justify-content:center}.tpc canvas{max-width:100%;max-height:112px;width:auto!important;height:auto!important;margin:0}.tg{font-size:12px;font-weight:800;color:var(--g);margin:14px 0 2px;display:flex;align-items:center;gap:6px}.tg:after{content:"";flex:1;height:1px;background:var(--line)}.chip.pal{display:inline-flex;gap:0;padding:0;overflow:hidden;border-radius:99px;width:54px;height:30px}.chip.pal span{flex:1}
.gi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}.imt{border:1px dashed #b9c9bd;border-radius:12px;padding:8px 6px;text-align:center;background:#fafcfa}.imt label.l{margin:0 0 4px;font-size:12px}.imt img{width:56px;height:56px;object-fit:contain;border-radius:8px;background:#fff;border:1px solid var(--line)}.imt label.btn{padding:5px 4px;font-size:11px;margin:6px 0 0;display:inline-block;white-space:nowrap;overflow:visible;max-width:none}.imt .btn.r{padding:5px 6px}
.gc{display:grid;grid-template-columns:1fr 1fr;gap:10px}.gc input[type=color]{padding:2px;cursor:pointer}.gs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.gs select{padding:9px 6px;font-size:13px}
details.card>summary{list-style:none;cursor:pointer;font-size:16px;font-weight:800;color:var(--g);display:flex;justify-content:space-between;align-items:center;margin:-2px 0 6px}details.card>summary::-webkit-details-marker{display:none}details.card>summary:after{content:"▾";font-size:14px;color:var(--mut);transition:transform .2s}details.card:not([open])>summary:after{transform:rotate(90deg)}details.card:not([open])>summary{margin-bottom:0}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.stats div{background:#eef4f0;border-radius:10px;padding:8px 2px;text-align:center}.stats b{display:block;font-size:18px;color:var(--g)}.stats span{font-size:11px;color:var(--mut)}.stu input[type=checkbox]{width:18px;height:18px;flex:none;accent-color:var(--g)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;justify-items:center}
.cv{width:242px;height:153px;position:relative;zoom:1.35;background:#fbf7ec;border:.8px solid #c8aa50;border-radius:8px;overflow:hidden;font-family:Helvetica,Arial,sans-serif;direction:ltr;color:#000}
.cv *{position:absolute}.cv .t{white-space:nowrap;line-height:1}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#17261d;color:#fff;padding:10px 16px;border-radius:12px;z-index:50;max-width:90%;font-size:14px}
.modal{position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:14px;overflow:auto}.modal .box{background:#fff;border-radius:14px;padding:14px;max-width:520px;width:100%;margin-top:20px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
</style>
</head>

<header><div class="hrow"><div><h1 id="ttl"></h1><div class="sub" id="stt"></div></div><div class="row"><button class="btn" id="inst" style="padding:6px 12px;display:none"></button><button class="btn" id="hlp" style="padding:6px 12px" aria-label="Aide">❓</button><button class="btn" id="lg" style="padding:6px 12px">FR / ع</button></div></div></header>
<div class="flag"></div>
<div id="sbar"></div>
<nav id="nav"></nav>
<main id="app"></main>
<div id="tst" class="toast" style="display:none"></div>

"use strict";
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let LANG="ar";try{LANG=localStorage.getItem("cs_lang")||"ar"}catch(e){}
const T=(fr,ar)=>LANG==="ar"?ar:fr;
const DEF={nom:"",ligne1:"RÉPUBLIQUE DU MALI",devise:"Un Peuple - Un But - Une Foi",adresse:"",sous:"",titre:"Carte scolaire",annee:(()=>{const d=new Date(),y=d.getFullYear();return d.getMonth()>=8?y+"-"+(y+1):(y-1)+"-"+y})(),tel:"",color:"#0E4A32",accent:"#DEB028",flag:true,prefix:"",marks:true,llang:"fr",tpl:"classic",type:"student",radius:8,pshape:"square",paper:"cream",directeur:"Le Directeur",logo:"",sign:"",cachet:"",next:1};
let CFG={...DEF},ST=[],TAB="school",SEL=new Set(),META={ids:[],names:{},cur:""},CUR="";
/* ---------- stockage (IndexedDB, repli mémoire) ---------- */
let DB=null;function idb(){return new Promise(r=>{try{const q=indexedDB.open("cartes_scolaires",1);q.onupgradeneeded=()=>q.result.createObjectStore("kv");q.onsuccess=()=>{DB=q.result;r()};q.onerror=()=>r()}catch(e){r()}})}
const save=()=>{if(!CUR)return;kvSet("cfg:"+CUR,CFG);kvSet("st:"+CUR,ST);if(META.names[CUR]!==(CFG.nom||"")){META.names[CUR]=CFG.nom||"";kvSet("meta",META);schoolBar()}};
const uid=()=>Math.random().toString(36).slice(2,9);
async function loadSchool(id){CUR=id;META.cur=id;kvSet("meta",META);const c=await kvGet("cfg:"+id),s=await kvGet("st:"+id);CFG={...DEF,...(c||{})};ST=Array.isArray(s)?s:[];TR=(await kvGet("tr:"+id))||[];SELS.clear();Q="";QC="";PC="";}
function schoolBar(){const n=i=>META.names[i]||T("École sans nom","مدرسة بلا اسم");$("#sbar").innerHTML=`<select id="sc">${META.ids.map(i=>`<option value="${i}" ${i===CUR?"selected":""}>🏫 ${esc(n(i))}</option>`).join("")}</select><button class="btn p" id="sa">＋ ${T("École","مدرسة")}</button>${META.ids.length>1?`<button class="btn r" id="sd">🗑</button>`:""}`;
 $("#sc").onchange=async e=>{await loadSchool(e.target.value);TAB=ST.length?"students":"school";render()};
 $("#sa").onclick=async()=>{const id=uid();META.ids.push(id);META.names[id]="";CFG={...DEF};ST=[];CUR=id;await kvSet("cfg:"+id,CFG);await kvSet("st:"+id,ST);await loadSchool(id);WZ={step:0,pays:"ml",lang:LANG,sys:"fr1",lvls:["pri","col"],nom:"",sous:"",pal:0,logo:""};TAB="school";toast(T("Nouvelle école créée","تمت إضافة مدرسة جديدة"));render()};
 if($("#sd"))$("#sd").onclick=async()=>{if(!confirm(T("Supprimer cette école et tous ses élèves de cet appareil ?","حذف هذه المدرسة وكل تلاميذها من هذا الجهاز؟")))return;const old=CUR;META.ids=META.ids.filter(i=>i!==old);delete META.names[old];kvSet("cfg:"+old,null);kvSet("st:"+old,null);await loadSchool(META.ids[0]);TAB=ST.length?"students":"school";render()}}
function toast(m){const t=$("#tst");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display="none",3200)}
/* ---------- utilitaires ---------- */
const hasAr=s=>/[؀-ۿ]/.test(s||"");
const rgb=h=>{h=(h||"#000").replace("#","");if(h.length===3)h=h.split("").map(c=>c+c).join("");const n=parseInt(h,16);return[n>>16&255,n>>8&255,n&255]};
const dark=c=>c.map(v=>Math.round(v*.72));
function fdate(v){if(!v)return"";if(/^\d{4}-\d{2}-\d{2}$/.test(v)){const[a,b,c]=v.split("-");return c+"/"+b+"/"+a}return v}
function initials(n){const w=(n||"?").trim().split(/\s+/);if(hasAr(n))return w[0][0];return w.map(x=>x[0]).join("").slice(0,2).toUpperCase()}
function pad(n,w){return String(n).padStart(w,"0")}
